name: ios

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build unsigned app
        run: |
          xcodebuild -project SonekkChat.xcodeproj \
            -scheme SonekkChat \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SonekkChat.app Payload/
          zip -qry SonekkChat.ipa Payload
          ls -lh SonekkChat.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: SonekkChat-ipa
          path: SonekkChat.ipa
          if-no-files-found: error
